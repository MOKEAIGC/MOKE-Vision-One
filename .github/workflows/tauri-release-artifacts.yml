name: tauri-release-artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-platform-bundle:
    name: build-${{ matrix.artifactKey }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifactKey: windows-x64
            target: x86_64-pc-windows-msvc
            npmScript: tauri:build:win:x64
            bundleGlob: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          - os: macos-14
            artifactKey: darwin-x64
            target: x86_64-apple-darwin
            npmScript: tauri:build:mac:x64
            bundleGlob: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          - os: macos-14
            artifactKey: darwin-arm64
            target: aarch64-apple-darwin
            npmScript: tauri:build:mac:arm64
            bundleGlob: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri bundle
        run: npm run ${{ matrix.npmScript }}

      - name: Upload raw platform bundle
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifactKey }}
          path: ${{ matrix.bundleGlob }}
          if-no-files-found: error
          retention-days: 14

  assemble-release-artifacts:
    name: assemble-release-artifacts
    runs-on: ubuntu-latest
    needs: build-platform-bundle

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download raw platform bundles
        uses: actions/download-artifact@v4
        with:
          path: .ci-artifacts

      - name: Stage bundles for release packager
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
          mkdir -p src-tauri/target/x86_64-apple-darwin/release/bundle/dmg
          mkdir -p src-tauri/target/aarch64-apple-darwin/release/bundle/dmg

          cp .ci-artifacts/windows-x64/*.exe src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/
          cp .ci-artifacts/darwin-x64/*.dmg src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/
          cp .ci-artifacts/darwin-arm64/*.dmg src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/

      - name: Assemble final release artifacts
        run: npm run release:artifacts

      - name: Upload final release artifact set
        uses: actions/upload-artifact@v4
        with:
          name: moke-vision-one-release-artifacts
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MOKE Vision One ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.txt